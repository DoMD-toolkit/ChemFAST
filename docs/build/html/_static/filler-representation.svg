<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="title desc">
<title id="title">POSS filler: reactive arms and non-reactive centers form one rigid body</title>
<desc id="desc">The atomistic view uses the supplied POSS PDB coordinates and bonds. Four mapped NH2 groups are highlighted in blue. The CG schematic contains four blue CN arm beads and several grey SiO center beads. All CG beads belong to one rigid body; there is no additional central hub.</desc>
<defs><radialGradient id="arm"><stop offset="0" stop-color="#64c5fa"/><stop offset="1" stop-color="#0783c8"/></radialGradient><radialGradient id="center"><stop offset="0" stop-color="#d9e3e9"/><stop offset="1" stop-color="#92a7b7"/></radialGradient></defs>
